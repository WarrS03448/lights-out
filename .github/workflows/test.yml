name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Python test dependency
        run: python -m pip install -r hub/requirements.txt pytest==9.1.1
      - name: Connection IP privacy checks
        run: |
          npm --prefix server run test:privacy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/test_relay_browser.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest tests/test_telemetry.py tests/test_host_travel_safety.py tests/test_attribution_privacy.py -q
          exit $LASTEXITCODE
      - name: Python tests
        run: python -m pytest -q
      - name: Server tests
        working-directory: server
        run: npm test
