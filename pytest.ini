[pytest]
# Collect only `def test_*`, not a bare `def test`.
#
# Several suites here define a local runner helper called `test(fn)` - the same shape the .mjs
# suites use - and pytest's DEFAULT pattern is `test*`, which matches it. It then treats the
# helper's `fn` parameter as a fixture request and every one of those files reports
#
#     ERROR at setup of test - fixture 'fn' not found
#
# ...which looks like a broken test and is really just pytest collecting a function that was never
# a test. Requiring the underscore excludes the helpers and still matches every real test.
python_functions = test_*

testpaths = tests
